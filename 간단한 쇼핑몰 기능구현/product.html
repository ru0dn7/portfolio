<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>상품 상세</title>
    <meta name="description" content="상품 상세 페이지">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body data-page="product">
    <header class="site-header" role="banner">
      <div class="container nav">
        <a class="brand" href="index.html">
          <span class="logo" aria-hidden="true"></span>
          <span>KW Shop</span>
        </a>
        <nav class="nav-links" aria-label="주요 메뉴">
          <a href="index.html">홈</a>
          <a href="products.html">상품</a>
          <a class="cart-pill" href="cart.html" aria-label="장바구니">
            <span>장바구니</span>
            <span class="cart-count" id="cart-count">0</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="product-detail" aria-labelledby="detail-title">
        <div>
          <img id="detail-image" alt="" width="800" height="800">
        </div>
        <div class="product-info">
          <h1 id="detail-title" class="section-title">상품명</h1>
          <div id="detail-price" class="price">0 <span class="won">원</span></div>
          <p id="detail-desc" class="muted">상품 설명</p>
          <div class="field">
            <label for="detail-qty">수량</label>
            <input id="detail-qty" class="qty" type="number" min="1" value="1">
          </div>
          <div class="product-actions">
            <button id="detail-add" class="btn btn-primary">장바구니 담기</button>
            <a class="btn" href="cart.html">장바구니 보기</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">© 2025  · 반응형 쇼핑몰 만들기</div>
    </footer>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
  </html>
